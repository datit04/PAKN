services:
  # 1. Cơ sở dữ liệu SQL Server 2022
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: pakn_sqlserver
    restart: unless-stopped
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=PaknDbPassword@2026
      - MSSQL_PID=Developer
    ports:
      - "1433:1433"
    volumes:
      - mssql_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'PaknDbPassword@2026' -C -Q 'SELECT 1' 2>/dev/null || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P 'PaknDbPassword@2026' -Q 'SELECT 1' 2>/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  # 2. Backend .NET 8 Web API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pakn_backend
    restart: unless-stopped
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=sqlserver,1433;Database=PAKN_System_Db;User Id=sa;Password=PaknDbPassword@2026;TrustServerCertificate=True;MultipleActiveResultSets=true;
    volumes:
      - backend_uploads:/app/uploads
    depends_on:
      sqlserver:
        condition: service_healthy

  # 3. Frontend React (Vite) + Nginx Reverse Proxy
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pakn_frontend
    restart: unless-stopped
    ports:
      # Sếp và các máy trong mạng LAN truy cập qua cổng 80 (hoặc đổi thành 8080:80 nếu cổng 80 bị trùng)
      - "80:80"
    depends_on:
      - backend

volumes:
  mssql_data:
  backend_uploads:
