
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pakn-frontend
  namespace: default
  labels:
    app: pakn-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: pakn-frontend
  template:
    metadata:
      labels:
        app: pakn-frontend
    spec:
      containers:
        - name: pakn-frontend
          image: pakn-frontend:v1.0.0
          imagePullPolicy: Never
          ports:
            - containerPort: 80
              name: http
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
